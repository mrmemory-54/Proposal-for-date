<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you go out with me?</title>
  
  <!-- Retro Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ff91af;
      /* Pixel Dot Pattern like video */
      background-image: radial-gradient(#ff6893 25%, transparent 25%);
      background-size: 18px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Main Container Card */
    .container {
      background: rgba(255, 175, 198, 0.85);
      backdrop-filter: blur(8px);
      border: 4px solid #ffffff;
      border-radius: 28px;
      padding: 30px 20px;
      width: 350px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(214, 51, 108, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    /* Pixel GIF Box with Dark Border */
    .gif-frame {
      background: #ffffff;
      border: 4px solid #4a1525;
      border-radius: 20px;
      padding: 6px;
      display: inline-block;
      box-shadow: 0 6px 0 #4a1525;
      margin-bottom: 20px;
    }

    .gif-frame img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    /* Title Styling */
    .title {
      color: #ffffff;
      font-size: 18px;
      line-height: 1.6;
      text-shadow: 3px 3px 0px #be2d5a, -2px -2px 0px #be2d5a, 2px -2px 0px #be2d5a, -2px 2px 0px #be2d5a;
      margin: 10px 0 25px 0;
      letter-spacing: 1px;
    }

    /* Buttons Container */
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 60px;
    }

    /* Pixel Art Buttons */
    .btn-yes {
      background: #ff2a5f;
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 5px 0 #990026;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      text-shadow: 1px 1px 0 #73001c;
    }

    .btn-no {
      background: #ffffff;
      color: #ff2a5f;
      border: 3px solid #ff2a5f;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d96282;
      transition: all 0.1s;
    }

    .sub-text {
      color: #73001c;
      font-size: 9px;
      margin-top: 15px;
      height: 12px;
      font-weight: bold;
    }

    /* Date Screen Input */
    .date-input-box {
      margin: 15px 0;
    }

    input[type="date"] {
      font-family: 'Press Start 2P', cursive;
      background: #ffffff;
      border: 3px solid #ff2a5f;
      padding: 10px;
      border-radius: 10px;
      color: #73001c;
      font-size: 10px;
      outline: none;
      box-shadow: 0 4px 0 #d96282;
    }

    /* Activity Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin: 15px 0 20px 0;
    }

    .opt-card {
      background: #ffffff;
      border: 3px solid #ff7597;
      border-radius: 10px;
      padding: 12px 6px;
      font-size: 8px;
      color: #73001c;
      cursor: pointer;
      box-shadow: 0 4px 0 #e6a1b2;
      line-height: 1.4;
    }

    .opt-card.active {
      background: #ff2a5f;
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 4px 0 #990026;
    }

    /* Action Buttons (CONTINUE / LOCK IT IN) */
    .action-btn {
      background: #ffffff;
      color: #ff2a5f;
      border: 3px solid #ff2a5f;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d96282;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d96282;
    }
  </style>
</head>
<body>

  <!-- STEP 1: PROPOSAL -->
  <div id="step1" class="container">
    <div class="gif-frame">
      <img id="mainGif" src="https://media.tenor.com/gU21EgM3K58AAAAi/peach-cat-cute.gif" alt="Cat">
    </div>
    <div class="title">Will you go out with me?</div>
    
    <div class="btn-group">
      <button id="yesBtn" class="btn-yes" onclick="nextStep(2)">YES!</button>
      <button id="noBtn" class="btn-no" onclick="handleNo()">No</button>
    </div>
    <div id="noMsg" class="sub-text"></div>
  </div>

  <!-- STEP 2: YAY & PICK A DATE -->
  <div id="step2" class="container hidden">
    <div class="gif-frame">
      <img src="https://media.tenor.com/vH97Z9d1S50AAAAi/milk-and-mocha-hug.gif" alt="Hug">
    </div>
    <div class="title" style="font-size: 22px;">YAY! 💕</div>
    <div class="sub-text" style="font-size: 9px; margin-bottom: 15px;">I'M SO GLAD U SAID YES.</div>
    
    <div class="date-input-box">
      <div class="sub-text" style="margin-bottom: 8px;">PICK A DATE</div>
      <input type="date" id="datePicker">
    </div>

    <button class="action-btn" onclick="goToStep3()">PRESS TO CONTINUE ➔</button>
  </div>

  <!-- STEP 3: SELECT ACTIVITY -->
  <div id="step3" class="container hidden">
    <div class="title" style="font-size: 12px; line-height: 1.8;">WHAT WOULD YOU LIKE TO DO?</div>
    
    <div class="options-grid">
      <div class="opt-card" onclick="selectOpt(this, 'DINNER DATE')">DINNER DATE</div>
      <div class="opt-card" onclick="selectOpt(this, 'MOVIE NIGHT')">MOVIE NIGHT</div>
      <div class="opt-card" onclick="selectOpt(this, 'COFFEE & WALK')">COFFEE & WALK</div>
      <div class="opt-card" onclick="selectOpt(this, 'PICNIC')">PICNIC</div>
      <div class="opt-card" onclick="selectOpt(this, 'MINI GOLF')">MINI GOLF</div>
      <div class="opt-card active" onclick="selectOpt(this, 'SURPRISE ME')">SURPRISE ME</div>
    </div>

    <button class="action-btn" onclick="finishDate()">LOCK IT IN 🔒</button>
  </div>

  <!-- STEP 4: FINAL SCREEN -->
  <div id="step4" class="container hidden">
    <div class="gif-frame">
      <img src="https://media.tenor.com/T_08mU0S-xAAAAAi/milk-and-mocha-bear.gif" alt="Love">
    </div>
    <div class="title" style="font-size: 18px;">IT'S A DATE! 🎉</div>
    <div id="summary" class="sub-text" style="font-size: 9px; line-height: 2; margin-top: 10px;"></div>
  </div>

  <script>
    let scale = 1;
    let selectedActivity = "SURPRISE ME";

    // 🔴 আপনার Telegram Bot Details এখানে দিন (যদি নোটিফিকেশন চান)
    const BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN";
    const CHAT_ID = "YOUR_TELEGRAM_CHAT_ID";

    const noTexts = [
      "Are you sure?",
      "Better say yes!",
      "Babe please :(",
      "Don't do this...",
      "I'm gonna cry...",
      "Heart broken... 💔"
    ];
    let msgIdx = 0;

    function handleNo() {
      // YES বাটন বড় হবে
      scale += 0.4;
      const yesBtn = document.getElementById('yesBtn');
      yesBtn.style.transform = `scale(${scale})`;

      // নিচের টেক্সট পরিবর্তন হবে
      document.getElementById('noMsg').innerText = noTexts[msgIdx];
      msgIdx = (msgIdx + 1) % noTexts.length;
    }

    function nextStep(step) {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }

    function goToStep3() {
      const dateVal = document.getElementById('datePicker').value;
      if (!dateVal) {
        alert("Please pick a date first! 📅");
        return;
      }
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
    }

    function selectOpt(element, activity) {
      document.querySelectorAll('.opt-card').forEach(card => card.classList.remove('active'));
      element.classList.add('active');
      selectedActivity = activity;
    }

    function finishDate() {
      const dateVal = document.getElementById('datePicker').value;
      document.getElementById('step3').classList.add('hidden');
      document.getElementById('step4').classList.remove('hidden');

      document.getElementById('summary').innerHTML = `
        DATE: <span style="color: #ff2a5f;">${dateVal}</span><br>
        ACTIVITY: <span style="color: #ff2a5f;">${selectedActivity}</span>
      `;

      // টেলিগ্রামে অ্যালার্ট পাঠানো
      if (BOT_TOKEN !== "YOUR_TELEGRAM_BOT_TOKEN") {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `🎉 SHE SAID YES!\n\n📅 Date: ${dateVal}\n🍕 Activity: ${selectedActivity}`
          })
        });
      }
    }
  </script>
</body>
</html>
